<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b14">
<meta name="description" content="VideoCash — your account and social tasks dashboard.">
<title>VideoCash — Dashboard</title>

<style>
:root{
  --bg:#080b14;--panel:#101625;--panel2:#151d2e;
  --border:#263149;--text:#f4f7ff;--muted:#929db5;
  --primary:#795cff;--primary2:#a18cff;--green:#35d49a;
  --red:#ff697e;--radius:16px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:inherit;text-decoration:none}
.layout{display:flex;min-height:100vh}
.sidebar{width:245px;flex-shrink:0;padding:24px 16px;background:#0c101d;border-right:1px solid var(--border);position:fixed;inset:0 auto 0 0;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:800;padding:4px 10px 30px}
.brand-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),#3b9dff)}
.brand span:last-child{color:var(--primary2)}
.nav-label{color:var(--muted);font-size:11px;letter-spacing:1.5px;margin:18px 12px 9px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;margin:4px 0;border:1px solid transparent;border-radius:11px;background:transparent;color:#aab4ca}
.nav-btn:hover,.nav-btn.active{background:#1a1d37;border-color:#342d64;color:white}
.nav-icon{width:22px;text-align:center;font-size:18px}
.sidebar-bottom{margin-top:30px;border-top:1px solid var(--border);padding:18px 8px;color:var(--muted);font-size:12px;line-height:1.8}
.main{margin-left:245px;width:calc(100% - 245px);min-width:0}
.topbar{height:76px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:rgba(8,11,20,.9
